f1ap:
  cu_cp_addr: 127.0.10.1
  bind_addr: 127.0.10.2
f1u:
  socket:
    -
      bind_addr: 127.0.10.2
ru_sdr:
  device_driver: uhd
  device_args: type=x300,addr=192.168.40.2
  srate: 11.52
  tx_gain: 20
  rx_gain: 20
cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 1
  pdsch:
    max_consecutive_kos: 0
  pusch:
    max_consecutive_kos: 0
  pucch:
    max_consecutive_kos: 0
    p0_nominal: -70
  slicing:
    -
      sst: 1
      sd: 1
      sched_cfg:
        min_prb_policy_ratio: 30
        max_prb_policy_ratio: 100
    -
      sst: 1
      sd: 2
      sched_cfg:
        min_prb_policy_ratio: 30
        max_prb_policy_ratio: 100
    -
      sst: 1
      sd: 3
      sched_cfg:
        min_prb_policy_ratio: 30
        max_prb_policy_ratio: 100
e2:
  enable_du_e2: true
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true
  addr: 10.0.2.10
  bind_addr: 10.0.2.1
  port: 36421
metrics:
  enable_json: true
  layers:
    enable_rlc: true
    enable_sched: true
  periodicity:
    du_report_period: 1000
remote_control:
  bind_addr: 0.0.0.0
  port: 8001
  enabled: true
log:
  filename: /tmp/du.log
  all_level: info
  e2ap_level: debug
