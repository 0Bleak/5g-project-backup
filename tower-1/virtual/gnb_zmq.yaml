ran_node_name: cu_cp_02
gnb_id: 999
gnb_id_bit_length: 22
gnb_cu_up_id: 1
gnb_du_id: 2

cu_cp:
  amf:
    addr: 192.168.0.3
    port: 38412
    bind_addr: 192.168.0.4
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
              - sst: 1
                sd: 1
              - sst: 1
                sd: 2
              - sst: 1
                sd: 3
  inactivity_timer: 7200

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:3000,rx_port=tcp://127.0.0.1:3009,base_srate=11.52e6
  srate: 11.52
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 2
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 6
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64
  slicing:
    - sst: 1
      sd: 1
      sched_cfg:
        min_prb_policy_ratio: 0
        max_prb_policy_ratio: 100
    - sst: 1
      sd: 2
      sched_cfg:
        min_prb_policy_ratio: 0
        max_prb_policy_ratio: 100
    - sst: 1
      sd: 3
      sched_cfg:
        min_prb_policy_ratio: 0
        max_prb_policy_ratio: 100

metrics:
  enable_json: true
  layers:
    enable_sched: true
    enable_rlc: true
  periodicity:
    du_report_period: 1000

remote_control:
  bind_addr: 0.0.0.0
  port: 8003
  enabled: true

log:
  filename: /tmp/gnb_zmq.log
  all_level: warning
